<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>mikrotik-suspender — demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(1200px 700px at 50% 40%, #16233d 0%, #0a0f1c 60%, #05070d 100%);
    color: #e8eefb;
    font-family: "DejaVu Sans", system-ui, sans-serif;
  }
  .card { text-align: center; max-width: 900px; padding: 0 40px; }
  .shield { font-size: 64px; line-height: 1; margin-bottom: 18px; }
  h1 { font-size: 44px; margin: 0 0 10px; letter-spacing: -.01em; }
  h1 b { color: #ffd166; font-weight: 700; }
  p { font-size: 19px; line-height: 1.55; color: #b7c4de; margin: 0 auto; }
  .tags { display: flex; gap: 10px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .tag { font-size: 13px; padding: 7px 14px; border-radius: 99px;
         border: 1px solid #2b3d5f; background: #111a2c; color: #9fb2d4;
         font-family: "DejaVu Sans Mono", monospace; }
  .note { margin-top: 34px; font-size: 13px; color: #7d8caa; }
</style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>mikrotik-<b>suspender</b></h1>
    <p>CSV de clientes → <strong>plan</strong> (solo lectura) → <strong>apply</strong> →
       <strong>address-list</strong> en el router.</p>
    <div class="tags">
      <span class="tag">FastAPI</span>
      <span class="tag">RouterOS API</span>
      <span class="tag">address-list</span>
      <span class="tag">Docker</span>
    </div>
    <div class="note">Demo sobre un <strong>MikroTik CHR real</strong> (RouterOS 7.24, QEMU/KVM) e IPs y nombres falsos.</div>
  </div>
</body>
</html>
