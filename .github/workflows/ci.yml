name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip==26.1.2
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy core use_cases adapters api cli
      - run: pytest -q
      - run: python -m build
      - run: pip-audit
      - run: docker build -t mikrotik-suspender:ci .
