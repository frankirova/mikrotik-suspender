[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrotik-suspender"
version = "0.1.0"
description = "Plan, approve and reconcile RouterOS suspension address lists"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "frankirova"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "routeros-api>=0.18,<1.0",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "httpx>=0.27,<1.0",
  "mypy==1.16.1",
  "pip-audit==2.9.0",
  "pytest>=8.0,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff==0.12.3",
]

[project.scripts]
mikrotik-suspender = "cli.__main__:main"

[tool.setuptools]
py-modules = ["bootstrap", "main"]
packages = ["adapters", "api", "cli", "core", "use_cases", "mikrotik_suspender"]

[tool.setuptools.data-files]
"share/mikrotik-suspender/static" = ["static/index.html"]
"share/mikrotik-suspender/static/css" = ["static/css/style.css"]
"share/mikrotik-suspender/static/js" = ["static/js/app.js"]
"share/mikrotik-suspender/data" = ["data/clientes.csv.example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests"]
