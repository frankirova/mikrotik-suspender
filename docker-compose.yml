services:
  mikrotik-suspender:
    build: .
    container_name: mikrotik-suspender
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      API_KEY: ${API_KEY:?API_KEY is required for the container's non-loopback bind}
      ROUTERS_JSON: ${ROUTERS_JSON:?ROUTERS_JSON with an explicit address_list per alias is required}
    volumes:
      - mikrotik_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mikrotik_data:
